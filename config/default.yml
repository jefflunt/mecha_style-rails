# Default configuration for mecha_style-rails.

Layout/LineLength:
  Max: 256

Style/GuardClause:
  Enabled: true
  MinBodyLength: 1

Rails/DefaultScope:
  Enabled: true

MechaStyleRails/Example:
  Description: "Starter template cop demonstrating AST matching and autocorrection."
  Enabled: false
  VersionAdded: "0.1.0"

MechaStyleRails/NamespaceBaseController:
  Description: "Namespaced controllers must inherit from their namespace BaseController."
  Enabled: true
  VersionAdded: "0.2.0"

MechaStyleRails/NoVisibilityModifiers:
  Description: "Disallow private/protected in favor of _method and __method naming."
  Enabled: true
  VersionAdded: "0.2.0"

MechaStyleRails/NoInlineJsonRender:
  Description: "Disallow inline JSON hash/array rendering in controllers; use app/presenters/."
  Enabled: true
  AllowErrorHash: true
  VersionAdded: "0.2.0"

MechaStyleRails/NoInlineHashMapping:
  Description: "Disallow inline .map { |x| { ... } } hash formatting in controllers; use app/presenters/."
  Enabled: true
  VersionAdded: "0.2.0"

MechaStyleRails/NoFallbackParamLookup:
  Description: "Disallow fallback params lookups and string-to-boolean params comparisons."
  Enabled: true
  VersionAdded: "0.2.0"

MechaStyleRails/NoPresenceTernary:
  Description: "Disallow noisy params[:x].present? ? ... : ... ternaries in controllers."
  Enabled: true
  VersionAdded: "0.2.0"

MechaStyleRails/InlineRedirectFlash:
  Description: "Pass alert:/notice: directly to redirect_to instead of assigning flash[:alert]/flash[:notice] beforehand."
  Enabled: true
  VersionAdded: "0.3.0"
